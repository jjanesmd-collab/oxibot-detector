<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OxiBot Modular</title>
<meta name="theme-color" content="#16a34a">
<script src="https://cdn.tailwindcss.com"></script>
<style>
.btn-3d{box-shadow:0 8px 0 #0f5132,0 15px 20px rgba(0,0,0,0.4);transform:translateY(0);transition:all 0.1s}
.btn-3d:active{box-shadow:0 2px 0 #0f5132,0 5px 10px rgba(0,0,0,0.4);transform:translateY(6px)}
.tab-3d{box-shadow:0 4px 0 #1e293b,0 8px 15px rgba(0,0,0,0.3);transition:all 0.1s}
.tab-3d.active{box-shadow:0 2px 0 #15803d,0 6px 12px rgba(22,163,74,0.4);transform:translateY(2px);background:linear-gradient(145deg,#16a34a,#15803d)}
@keyframes slideIn{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
.card-enter{animation:slideIn 0.4s ease-out}
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
<div class="max-w-md mx-auto p-4">
<div class="text-center mb-4 pt-6">
<img src="https://cdn-icons-png.flaticon.com/512/2910/2910768.png" class="w-16 mx-auto mb-2">
<h1 class="text-2xl font-bold">OxiBot</h1>
<p class="text-green-400 text-sm font-bold">Modular v10.0</p>
</div>
<div id="tabsContainer" class="grid grid-cols-5 gap-2 mb-5"></div>
<div id="modulosContainer"></div>
</div>
<script>
let MODULOS_ACTIVOS = JSON.parse(localStorage.getItem('oxibot_modulos')||'["billete"]');
let CONFIG_MODULOS = {};
async function init(){
  try{
    const res = await fetch('./config/modulos.json');
    CONFIG_MODULOS = await res.json();
    cargarTabs();
    cargarModulosActivos();
  }catch(e){
    console.log('Error cargando config, usando default');
    CONFIG_MODULOS = {
      "billete":{"nombre":"BILLETE","icon":"💵","desc":"Demo","precio":0,"html":"<div class='bg-slate-800 rounded-3xl p-5'><h2>Error: Carga config/modulos.json</h2></div>","js":""}
    };
    cargarTabs();
    cargarModulosActivos();
  }
}
function cargarTabs(){
  const cont = document.getElementById('tabsContainer');
  cont.innerHTML = '';
  MODULOS_ACTIVOS.forEach(id=>{
    const m = CONFIG_MODULOS[id];
    if(!m) return;
    const btn = document.createElement('button');
    btn.className = 'tab-3d bg-slate-700 rounded-2xl py-4 flex flex-col items-center';
    btn.innerHTML = `<div class="text-3xl mb-1">${m.icon}</div><div class="text-[10px] font-bold">${m.nombre}</div>`;
    btn.onclick = ()=>mostrarModulo(id);
    cont.appendChild(btn);
  });
  const btnTienda = document.createElement('button');
  btnTienda.className = 'tab-3d bg-blue-600 rounded-2xl py-4 flex flex-col items-center';
  btnTienda.innerHTML = `<div class="text-3xl mb-1">➕</div><div class="text-[10px] font-bold">TIENDA</div>`;
  btnTienda.onclick = mostrarTienda;
  cont.appendChild(btnTienda);
  if(MODULOS_ACTIVOS.length>0) setTimeout(()=>mostrarModulo(MODULOS_ACTIVOS[0]),100);
}
async function cargarModulosActivos(){
  for(const id of MODULOS_ACTIVOS){
    const m = CONFIG_MODULOS[id];
    if(!m) continue;
    const div = document.createElement('div');
    div.id = `mod-${id}`;
    div.className = 'hidden';
    div.innerHTML = m.html;
    document.getElementById('modulosContainer').appendChild(div);
    if(m.js){
      const script = document.createElement('script');
      script.textContent = m.js;
      document.body.appendChild(script);
    }
  }
}
function mostrarModulo(id){
  document.querySelectorAll('#modulosContainer > div').forEach(d=>d.classList.add('hidden'));
  const mod = document.getElementById(`mod-${id}`);
  if(mod) mod.classList.remove('hidden');
  document.querySelectorAll('.tab-3d').forEach(t=>t.classList.remove('active','bg-green-600'));
  event.target.closest('.tab-3d').classList.add('active','bg-green-600');
}
function mostrarTienda(){
  let html = '<div class="bg-slate-800 rounded-3xl p-5"><h2 class="font-bold mb-4">🛒 Tienda de Módulos</h2>';
  Object.keys(CONFIG_MODULOS).forEach(id=>{
    const m = CONFIG_MODULOS[id];
    const activo = MODULOS_ACTIVOS.includes(id);
    html += `<div class="bg-slate-700 rounded-2xl p-4 mb-3 flex justify-between items-center"><div><div class="font-bold">${m.icon} ${m.nombre}</div><div class="text-xs text-slate-400">${m.desc}</div><div class="text-xs text-green-400 mt-1">${m.precio==0?'GRATIS':'$'+m.precio+'/mes'}</div></div>${activo?'<div class="text-green-400 text-xs">✓ Activo</div>':`<button onclick="window.open('https://t.me/OxiBotSoporte?text=Quiero módulo: ${m.nombre}')" class="bg-green-600 px-4 py-2 rounded-xl text-xs font-bold">Activar</button>`}</div>`;
  });
  html += `<button onclick="window.open('https://t.me/OxiBotSoporte?text=Quiero PACK COMPLETO')" class="w-full bg-yellow-500 text-black py-4 rounded-2xl font-bold mt-4">🔥 PACK COMPLETO $1/mes</button></div>`;
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 overflow-y-auto';
  modal.innerHTML = html;
  modal.onclick = (e)=>{ if(e.target===modal) modal.remove(); };
  document.body.appendChild(modal);
}
init();
</script>
</body>
</html>
