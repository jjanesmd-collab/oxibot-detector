<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OxiBot - Guardian IA</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#00c853;
  --primary-dark:#00a843;
  --bg:#f5f7fa;
  --bg-card:#ffffff;
  --bg-sidebar:#ffffff;
  --text:#1a1a2e;
  --text-muted:#64748b;
  --border:#e2e8f0;
  --shadow:0 4px 12px rgba(0,0,0,0.08);
  --shadow-hover:0 8px 24px rgba(0,200,83,0.15);
}
body{background:var(--bg);min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);overflow-x:hidden}

/* SIDEBAR LIGHT */
.sidebar{position:fixed;left:0;top:0;height:100vh;width:60px;background:var(--bg-sidebar);border-right:1px solid var(--border);transition:width.3s;z-index:50;overflow:hidden;box-shadow:var(--shadow)}
.sidebar:hover{width:200px}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:14px 12px;cursor:pointer;transition:all.2s;border-left:3px solid transparent;color:var(--text)}
.sidebar-item:hover{background:rgba(0,200,83,0.08);border-left-color:var(--primary)}
.sidebar-item.active{background:rgba(0,200,83,0.12);border-left-color:var(--primary);color:var(--primary)}
.sidebar-icon{font-size:24px;min-width:36px;text-align:center}
.sidebar-text{white-space:nowrap;opacity:0;transition:opacity.2s;font-weight:600;font-size:14px}
.sidebar:hover.sidebar-text{opacity:1}

/* SPEED DIAL CARDS LIGHT */
.speed-dial{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;max-width:900px;margin:0 auto}
.speed-card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:28px;cursor:pointer;transition:all.3s;box-shadow:var(--shadow)}
.speed-card:hover{transform:translateY(-6px);border-color:var(--primary);box-shadow:var(--shadow-hover)}
.speed-card-icon{font-size:56px;margin-bottom:12px}
.speed-card-title{font-weight:800;font-size:18px;margin-bottom:6px;color:var(--text)}
.speed-card-desc{font-size:13px;color:var(--text-muted);line-height:1.4}

/* MAIN CONTENT */
.main-content{margin-left:60px;min-height:100vh;padding:24px;transition:margin-left.3s}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0}.speed-dial{grid-template-columns:repeat(2,1fr);gap:12px}}

/* NEGOCIOS SPEED DIAL OPERA STYLE */
.negocios-speed-dial{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:40px}
.negocio-card{background:var(--bg-card);border:2px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;transition:all.4s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow);position:relative}
.negocio-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 20px 60px rgba(0,200,83,0.25);border-color:var(--primary)}
.negocio-card.flip{animation:flipCard.6s}
@keyframes flipCard{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.negocio-preview{height:140px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;overflow:hidden}
.negocio-preview::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,0.4) 100%)}
.negocio-badge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;color:white;z-index:2}
.negocio-info{padding:16px}
.negocio-nombre{font-weight:900;font-size:16px;margin-bottom:4px;color:var(--text)}
.negocio-desc{font-size:13px;color:var(--text-muted);margin-bottom:8px}
.negocio-footer{display:flex;align-items:center;justify-content-between}
.negocio-dist{font-size:12px;color:var(--text-muted)}
.negocio-promo{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:800;color:white}
@media(max-width:768px){.negocios-speed-dial{grid-template-columns:repeat(2,1fr);gap:12px}.negocio-preview{height:100px;font-size:48px}}

/* HEADER LIGHT */
.gx-header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:18px 28px;display:flex;align-items:center;justify-between;position:sticky;top:0;z-index:30;box-shadow:var(--shadow)}
.gx-logo{display:flex;align-items:center;gap:14px}
.gx-logo-icon{font-size:36px}
.gx-badge{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:900;box-shadow:0 4px 12px rgba(0,200,83,0.3)}

/* BUTTONS LIGHT STYLE */
.btn-gx{background:var(--bg-card);border:2px solid var(--border);padding:18px;border-radius:14px;font-weight:700;transition:all.2s;cursor:pointer;color:var(--text);box-shadow:var(--shadow)}
.btn-gx:hover{border-color:var(--primary);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.btn-gx:active{transform:translateY(0)}
.btn-gx-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none;box-shadow:0 6px 20px rgba(0,200,83,0.35)}
.btn-gx-primary:hover{box-shadow:0 8px 28px rgba(0,200,83,0.45)}

/* MOBILE HAMBURGER */
.hamburger{display:none;position:fixed;top:18px;left:18px;z-index:60;background:var(--bg-card);border:2px solid var(--border);padding:12px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
@media(max-width:768px){.hamburger{display:block}}

/* CARDS CONTENT */
.content-card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
</style>
</head>
<body>

<!-- HAMBURGER MOBILE -->
<button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="p-5 mb-2">
    <div class="text-4xl text-center">🛡️</div>
  </div>
  <div class="sidebar-item active" onclick="renderView('home')" id="nav-home">
    <div class="sidebar-icon">🏠</div><div class="sidebar-text">Inicio</div>
  </div>
  <div class="sidebar-item" onclick="renderView('billete')" id="nav-billete">
    <div class="sidebar-icon">💵</div><div class="sidebar-text">Detector</div>
  </div>
  <div class="sidebar-item" onclick="renderView('scanner')" id="nav-scanner">
    <div class="sidebar-icon">🔍</div><div class="sidebar-text">Scanner QR</div>
  </div>
  <div class="sidebar-item" onclick="renderView('cambio')" id="nav-cambio">
    <div class="sidebar-icon">💰</div><div class="sidebar-text">Tipo Cambio</div>
  </div>
  <div class="sidebar-item" onclick="renderView('tienda')" id="nav-tienda">
    <div class="sidebar-icon">🛒</div><div class="sidebar-text">Tienda</div>
  </div>
  <div class="sidebar-item" onclick="mostrarModalGuardian()" id="nav-guardian">
    <div class="sidebar-icon">🛡️</div><div class="sidebar-text">Guardian IA</div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
  <!-- HEADER -->
  <div class="gx-header">
    <div class="gx-logo">
      <div class="gx-logo-icon">🛡️</div>
      <div>
        <div class="text-2xl font-black text-gray-900">OxiBot</div>
        <div class="text-xs text-gray-500" id="statusUser">PLAN GRATIS</div>
      </div>
    </div>
    <div class="gx-badge">GUARDIAN $1</div>
  </div>

  <!-- APP CONTAINER -->
  <div id="app" class="mt-8"></div>
</div>

<script>
// ===== SISTEMA FREEMIUM =====
let usosHoy = parseInt(localStorage.getItem('oxibot_usos')||'0');
let esGuardian = localStorage.getItem('oxibot_guardian')==='true';
let fechaHoy = new Date().toDateString();
let modulos = {};
let modulosActivos = JSON.parse(localStorage.getItem('oxibot_modulos')||'["billete","scanner","cambio"]');

if(localStorage.getItem('oxibot_fecha')!== fechaHoy){
  usosHoy = 0;
  localStorage.setItem('oxibot_usos','0');
  localStorage.setItem('oxibot_fecha',fechaHoy);
}

if(esGuardian) document.getElementById('statusUser').innerHTML = '🛡️ GUARDIAN ACTIVO';

// ===== NEGOCIOS SPEED DIAL OPERA STYLE =====
const negociosData = [
  {id:1,nombre:"Cambio EL RAYO",desc:"Compra S/3.78 • Venta S/3.80",dist:"500m",icon:"💱",color:"#00c853",promo:"MEJOR PRECIO",gradient:"linear-gradient(135deg,#00c853 0%,#00e676 100%)",wsp:"51999888777"},
  {id:2,nombre:"Yape Agente Oficial",desc:"Sin comisión • 24/7",dist:"200m",icon:"📱",color:"#6c00ff",promo:"VERIFICADO",gradient:"linear-gradient(135deg,#6c00ff 0%,#9c27b0 100%)",wsp:"51999888778"},
  {nombre:"Farmacia 24H",desc:"20% descuento hoy",dist:"1km",icon:"💊",color:"#ff3d00",promo:"OFERTA",gradient:"linear-gradient(135deg,#ff3d00 0%,#ff6e40 100%)",wsp:"51999888779"},
  {nombre:"Pollería EL GORDO",desc:"1/4 pollo S/12",dist:"300m",icon:"🍗",color:"#ff6d00",promo:"HOT",gradient:"linear-gradient(135deg,#ff6d00 0%,#ff9800 100%)",wsp:"51999888780"},
  {nombre:"Casa Cambio PRO",desc:"Venta S/3.77",dist:"800m",icon:"💵",color:"#00bfa5",promo:"NUEVO",gradient:"linear-gradient(135deg,#00bfa5 0%,#00e5ff 100%)",wsp:"51999888781"},
  {nombre:"Botica SALUD",desc:"Consulta gratis",dist:"600m",icon:"⚕️",color:"#2979ff",promo:"HOY",gradient:"linear-gradient(135deg,#2979ff 0%,#00b0ff 100%)",wsp:"51999888782"},
  {nombre:"Cambio TRUJILLO",desc:"Compra S/3.76",dist:"1.2km",icon:"💲",color:"#00c853",promo:"TOP",gradient:"linear-gradient(135deg,#43a047 0%,#66bb6a 100%)",wsp:"51999888783"},
  {nombre:"Minimarket 24H",desc:"Delivery gratis",dist:"400m",icon:"🛒",color:"#ff6d00",promo:"24H",gradient:"linear-gradient(135deg,#ff6d00 0%,#ffa726 100%)",wsp:"51999888784"}
];

let negociosVisibles = [...negociosData].slice(0,6);

function renderNegociosSpeedDial(){
  const container = document.getElementById('negociosSpeedDial');
  if(!container) return;
  container.innerHTML = negociosVisibles.map(n=>`
    <div class="negocio-card" onclick="window.open('https://wa.me/${n.wsp}?text=Hola,%20vi%20tu%20negocio%20en%20OxiBot')">
      <div class="negocio-preview" style="background:${n.gradient}">
        <div class="negocio-badge">${n.promo}</div>
        <div style="z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3))">${n.icon}</div>
      </div>
      <div class="negocio-info">
        <div class="negocio-nombre">${n.nombre}</div>
        <div class="negocio-desc">${n.desc}</div>
        <div class="negocio-footer">
          <span class="negocio-dist">📍 ${n.dist}</span>
          <span class="negocio-promo" style="background:${n.color}">IR</span>
        </div>
      </div>
    </div>
  `).join('');
}

function rotarNegocios(){
  renderNegociosSpeedDial();
  setInterval(()=>{
    const cards = document.querySelectorAll('.negocio-card');
    const randomCard = cards[Math.floor(Math.random()*cards.length)];
    if(randomCard) randomCard.classList.add('flip');
    setTimeout(()=>{
      const indicesVisibles = [0,1,2,3,4,5].sort(()=>Math.random()-0.5).slice(0,2);
      const indicesTodos = negociosData.map((_,i)=>i).filter(i=>!negociosVisibles.includes(negociosData[i]));
      indicesVisibles.forEach(i=>{
        if(indicesTodos.length>0){
          const nuevoNegocio = negociosData[indicesTodos.splice(Math.floor(Math.random()*indicesTodos.length),1)[0]];
          negociosVisibles[i] = nuevoNegocio;
        }
      });
      renderNegociosSpeedDial();
    },300);
  },8000);
}

// ===== VERIFICAR LÍMITE =====
window.verificarLimite = function(){
  if(esGuardian) return true;
  if(usosHoy >= 3){
    mostrarModalGuardian();
    return false;
  }
  usosHoy++;
  localStorage.setItem('oxibot_usos',usosHoy);
  return true;
}

// ===== MODAL GUARDIAN =====
window.mostrarModalGuardian = function(){
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm';
  modal.innerHTML = `
    <div class="bg-white border-2 border-green-500 rounded-3xl p-8 max-w-md w-full shadow-2xl">
      <div class="text-center">
        <div class="text-7xl mb-4">🛡️</div>
        <h2 class="text-4xl font-black mb-2 text-gray-900">GUARDIAN IA</h2>
        <div class="inline-block bg-gradient-to-r from-yellow-400 to-orange-500 text-black px-5 py-2 rounded-full text-sm font-black mb-5">Solo $1/mes = S/4</div>
        <div class="text-left text-sm space-y-3 mb-6 bg-gray-50 p-5 rounded-2xl">
          <div class="flex items-center gap-3"><span class="text-green-500 text-xl">✓</span> <span class="text-gray-800">Análisis ILIMITADOS</span></div>
          <div class="flex items-center gap-3"><span class="text-green-500 text-xl">✓</span> <span class="text-gray-800">Alertas automáticas 99%</span></div>
          <div class="flex items-center gap-3"><span class="text-green-500 text-xl">✓</span> <span class="text-gray-800">Detector estafas SMS/WSP</span></div>
          <div class="flex items-center gap-3"><span class="text-green-500 text-xl">✓</span> <span class="text-gray-800">Radar casas cambio PRO</span></div>
          <div class="flex items-center gap-3"><span class="text-green-500 text-xl">✓</span> <span class="text-gray-800">Soporte WhatsApp 24/7</span></div>
        </div>
        <button onclick="window.open('https://wa.me/51999999999?text=Quiero%20GUARDIAN%20IA%20$1')"
          class="w-full btn-gx-primary py-5 rounded-2xl font-black text-lg mb-3">
          ACTIVAR AHORA - $1
        </button>
        <button onclick="this.closest('.fixed').remove()" class="text-sm text-gray-500">Volver mañana por 3 gratis</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

// ===== ACTIVAR GUARDIAN =====
window.activarGuardian = function(codigo){
  if(codigo === 'OXI2026'){
    localStorage.setItem('oxibot_guardian','true');
    alert('🛡️ GUARDIAN IA ACTIVADO\n\nModo Bestia desbloqueado');
    location.reload();
  }
}

// ===== RENDER VIEWS =====
fetch('./config/modulos.json').then(r=>r.json()).then(d=>{
  modulos=d;
  renderView('home');
  rotarNegocios();
});

function renderView(view){
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  document.getElementById(`nav-${view}`)?.classList.add('active');
  if(window.innerWidth<768) document.querySelector('.sidebar').classList.remove('open');

  if(view==='home'){
    document.getElementById('app').innerHTML = `
      <div class="mb-10">
        <h1 class="text-5xl font-black mb-3 text-gray-900">Speed Dial</h1>
        <p class="text-gray-600 text-lg">Acceso rápido a tus módulos</p>
        ${!esGuardian?`<div class="mt-5 bg-yellow-50 border-2 border-yellow-400 rounded-2xl p-4"><span class="text-yellow-600 font-bold">⚡ Usos hoy: ${3-usosHoy}/3 gratis</span> • <button onclick="mostrarModalGuardian()" class="text-green-600 underline font-bold">Upgrade a Guardian</button></div>`:''}
      </div>
      <div class="speed-dial">
        ${Object.keys(modulos).map(k=>{
          const m=modulos[k];const a=modulosActivos.includes(k);const gratis=m.precio===0;
          return `
            <div class="speed-card" onclick="${a?`renderView('${k}')`:`${gratis?`activarModulo('${k}')`:'mostrarModalGuardian()'}`}">
              <div class="speed-card-icon">${m.icon}</div>
              <div class="speed-card-title">${m.nombre}</div>
              <div class="speed-card-desc">${m.desc}</div>
              ${!a?`<div class="mt-3 text-sm font-bold ${gratis?'text-green-600':'text-orange-500'}">${gratis?'✓ GRATIS':'🔒 GUARDIAN $1'}</div>`:''}
            </div>
          `;
        }).join('')}
      </div>

      <!-- SPEED DIAL NEGOCIOS OPERA STYLE -->
      <div class="mt-12">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-3xl font-black text-gray-900 flex items-center gap-3">
            <span>🔥</span> Negocios Cerca
          </h2>
          <div class="flex items-center gap-2 text-sm text-gray-500">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <span>En vivo</span>
          </div>
        </div>
        <div class="negocios-speed-dial" id="negociosSpeedDial"></div>
      </div>
    `;
    return;
  }

  if(view==='tienda'){
    document.getElementById('app').innerHTML = `
      <h1 class="text-4xl font-black mb-8 text-gray-900">🛒 Tienda Módulos</h1>
      <div class="grid gap-5 max-w-3xl">
        ${Object.keys(modulos).map(k=>{
          const m=modulos[k];const a=modulosActivos.includes(k);const gratis=m.precio===0;
          return `
            <div class="content-card flex items-center gap-5">
              <div class="text-6xl">${m.icon}</div>
              <div class="flex-1">
                <div class="font-black text-xl mb-2 text-gray-900">${m.nombre} ${gratis?'<span class="text-xs bg-green-500 text-white px-3 py-1 rounded-full ml-2">GRATIS</span>':''}</div>
                <div class="text-gray-600">${m.desc}</div>
              </div>
              ${a?`<button class="btn-gx bg-green-500 text-white px-8" disabled>✓ ACTIVO</button>`:
              `<button onclick="${gratis?`activarModulo('${k}')`:'mostrarModalGuardian()'}" class="btn-gx ${gratis?'':'btn-gx-primary'} px-8">${gratis?'ACTIVAR':'$1/MES'}</button>`}
            </div>
          `;
        }).join('')}
      </div>
    `;
    return;
  }

  if(!modulosActivos.includes(view)){
    document.getElementById('app').innerHTML = `
      <div class="text-center py-24">
        <div class="text-8xl mb-6">🔒</div>
        <h2 class="text-3xl font-black mb-6 text-gray-900">Módulo Bloqueado</h2>
        <button onclick="renderView('tienda')" class="btn-gx-primary px-10 py-4 rounded-2xl font-black text-lg">IR A TIENDA</button>
      </div>
    `;
    return;
  }

  const m=modulos[view];
  document.getElementById('app').innerHTML = `<div class="max-w-3xl mx-auto">${m.html}</div>`;
  if(m.js){
    const s=document.createElement('script');
    s.textContent=m.js;
    document.body.appendChild(s);
  }
}

window.activarModulo=function(k){
  if(!modulosActivos.includes(k)){
    modulosActivos.push(k);
    localStorage.setItem('oxibot_modulos',JSON.stringify(modulosActivos));
  }
  renderView(k);
}
</script>
</body>
</html>
