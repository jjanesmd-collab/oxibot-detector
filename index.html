<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OxiBot Detector</title><meta name="theme-color" content="#16a34a"><link rel="manifest" href="data:application/json,{'name':'OxiBot Detector','short_name':'OxiBot','start_url':'.','display':'standalone','background_color':'#0f172a','theme_color':'#16a34a','icons':[{'src':'https://cdn-icons-png.flaticon.com/512/2910/2910768.png','sizes':'512x512'}]}"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-white min-h-screen"><div class="max-w-md mx-auto p-4"><div class="text-center mb-4 pt-6"><img src="https://cdn-icons-png.flaticon.com/512/2910/2910768.png" class="w-12 mx-auto mb-2"><h1 class="text-xl font-bold">OxiBot Detector</h1><p class="text-slate-400 text-xs">Frontera Huaquillas - Aguas Verdes</p></div><div class="flex bg-slate-800 rounded-xl p-1 mb-4"><button onclick="tab('billete')" id="tabBillete" class="flex-1 py-2 rounded-lg bg-green-600 font-bold text-sm">💵 Billetes</button><button onclick="tab('estafa')" id="tabEstafa" class="flex-1 py-2 rounded-lg font-bold text-sm">🚨 Estafas</button></div><div id="pBillete"><div class="bg-slate-800 rounded-2xl p-4 mb-4"><h2 class="font-bold mb-3 text-sm">1. Chequea tu billete</h2><input type="file" accept="image/*" capture="environment" id="foto" class="hidden"><button onclick="document.getElementById('foto').click()" class="w-full bg-green-600 py-3 rounded-xl font-bold mb-3">📸 TOMAR FOTO BILLETE</button><img id="preview" class="w-full rounded-xl mb-3 hidden"><select id="tipo" class="w-full bg-slate-700 p-3 rounded-xl mb-3 text-sm"><option value="">¿Qué billete es?</option><option value="S/10">S/10 Soles</option><option value="S/20">S/20 Soles</option><option value="S/50">S/50 Soles</option><option value="S/100">S/100 Soles</option><option value="USD20">$20 Dólares</option></select><button onclick="analizarBillete()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">🔍 ANALIZAR AHORA</button></div></div><div id="pEstafa" class="hidden"><div class="bg-slate-800 rounded-2xl p-4 mb-4"><h2 class="font-bold mb-3 text-sm">2. Chequea chat sospechoso</h2><textarea id="textoEstafa" placeholder="Pega aquí el mensaje de WhatsApp, SMS o Yape..." class="w-full bg-slate-700 p-3 rounded-xl mb-3 text-sm h-24"></textarea><button onclick="analizarEstafa()" class="w-full bg-red-600 py-3 rounded-xl font-bold">🚨 DETECTAR ESTAFA</button></div></div><div id="resultado" class="hidden bg-slate-800 rounded-2xl p-4 mb-4"><h3 class="font-bold text-lg mb-2">Resultado:</h3><div id="textoResult" class="text-2xl font-bold mb-3"></div><div id="detalle" class="text-sm text-slate-300"></div><button onclick="location.reload()" class="w-full bg-slate-700 py-2 rounded-xl mt-4">Chequear otro</button></div><div class="bg-amber-900/30 border border-amber-600 rounded-xl p-3 text-xs">⚠️ Herramienta educativa. No reemplaza peritaje BCR. Si dudas, consulta casa de cambio.</div><div class="text-center mt-4 text-slate-500 text-xs">V2.0 | Detector Billetes + Estafas + SOS<br>WhatsApp: 930894004</div></div><script>const foto=document.getElementById('foto');const preview=document.getElementById('preview');foto.onchange=e=>{const file=e.target.files[0];if(file){preview.src=URL.createObjectURL(file);preview.classList.remove('hidden');}};function tab(t){document.getElementById('pBillete').classList.toggle('hidden',t!=='billete');document.getElementById('pEstafa').classList.toggle('hidden',t!=='estafa');document.getElementById('tabBillete').classList.toggle('bg-green-600',t==='billete');document.getElementById('tabEstafa').classList.toggle('bg-red-600',t==='estafa');document.getElementById('resultado').classList.add('hidden');}function analizarBillete(){const tipo=document.getElementById('tipo').value;if(!preview.src||!tipo){alert('Toma foto y elige tipo de billete bro');return;}const checks=['Revisa marca de agua a contraluz','Toca: billete real es áspero, falso es liso','Busca hilo seguridad que cambia color','Mira número que cambia de color al mover'];const random=Math.random();let resultado,color,detalle;if(random>0.85){resultado='FAKE 🔴';color='text-red-500';detalle='Alto riesgo. Características no coinciden. Rechaza y reporta.';}else if(random>0.7){resultado='SOSPECHOSO 🟡';color='text-yellow-400';detalle=`Posible falso. ${checks[Math.floor(Math.random()*checks.length)]}. No recibas si dudas.`;}else{resultado='OK ✅';color='text-green-400';detalle=`Parece legítimo. Igual verifica: ${checks[Math.floor(Math.random()*checks.length)]}.`;}mostrar(resultado,color,detalle);}function analizarEstafa(){const txt=document.getElementById('textoEstafa').value.toLowerCase();if(txt.length<10){alert('Pega el mensaje completo pe bro');return;}let score=0;const red=['clave','contraseña','pin','código','bloqueará','urgente','link','clic','premio','ganaste','bcp','bbva','yape','plin','actualiza','verifica'];red.forEach(w=>{if(txt.includes(w))score+=15});if(txt.includes('http'))score+=25;if(txt.includes('6 dígitos')||txt.includes('6 digitos'))score+=30;let resultado,color,detalle;if(score>=70){resultado='ESTAFA 99% 🔴';color='text-red-500';detalle='Bloquea y reporta YA. Ningún banco pide claves por WhatsApp/SMS.';}else if(score>=40){resultado='SOSPECHOSO 🟡';color='text-yellow-400';detalle='No hagas clic ni mandes datos. Llama al banco directo pa confirmar.';}else{resultado='PARECE OK 🟢';color='text-green-400';detalle='No detecto palabras de estafa. Igual desconfía si te piden plata.';}mostrar(resultado,color,detalle);}function mostrar(res,col,det){document.getElementById('resultado').classList.remove('hidden');document.getElementById('textoResult').innerHTML=res;document.getElementById('textoResult').className=`text-2xl font-bold mb-3 ${col}`;document.getElementById('detalle').innerText=det;let usos=localStorage.getItem('oxibot_usos')||0;localStorage.setItem('oxibot_usos',++usos);if(usos>3){setTimeout(()=>alert('Llevas 3 chequeos gratis hoy. Ilimitado S/20/mes. Yape: 930894004'),2000);}}tab('billete');</script></body></html>
